[global]
    workgroup = WORKGROUP
    server string = Pandora File Server
    security = user
    map to guest = Bad User
    dns proxy = no
    
    # CRITICAL FOR RELAY: Disable signing or make it optional
    server signing = disabled
    smb encrypt = disabled

[webroot]
    path = /var/www/html
    valid users = admin
    read only = no
    browsable = yes
    writeable = yes
    create mask = 0777
    directory mask = 0777
    comment = Web Root Helper Share
